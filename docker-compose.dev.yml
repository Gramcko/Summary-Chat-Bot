# Development-only infrastructure for Summarly Chat Bot.
#
# PostgreSQL is the durable source of truth (docs/architecture.md 4.5).
# Redis carries BullMQ queue state for the summary milestone
# (docs/architecture.md 4.6) — it is NOT a source of truth: messages,
# runs, and completed summaries live in PostgreSQL only.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # keep the data volumes
#
# Both services are reachable only on the host loopback interface so they
# are never exposed to the network. Override the credentials through your
# shell environment or a local (untracked) .env file when needed.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-summarly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-summarly_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-summarly}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - summarly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis: BullMQ queue state ONLY (docs/architecture.md 4.6). Queue
  # retention (bounded removeOnComplete/removeOnFail), finite retries,
  # and the run reconciliation semantics live in docs/architecture.md
  # 4.6 and 6 — Redis persistence below reduces, but does not eliminate,
  # the need for recovery/reconciliation logic.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - summarly-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  summarly-postgres-data:
  summarly-redis-data:
  # WhatsApp (Baileys) session state — protected persistent storage
  # (ADR 0004, architecture §4.3/§9). Phase F mounts this on the
  # bot-worker service (WA_SESSION_DIR) with restrictive permissions
  # and a non-root user. It is NEVER stored in PostgreSQL, never
  # committed to Git, never exposed by any API or log, and must be
  # treated as sensitive in backups (it can link the account).
  summarly-wa-session:
